<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border: 1px solid #ddd;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #111;
            color: white;
            border: none;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .error {
            background: #ffe5e5;
            color: #b00000;
            padding: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #111;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form action="/admin-login" method="POST">

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <a class="home" href="/">
        ← Back to Store
    </a>

</div>

</body>

</html>
